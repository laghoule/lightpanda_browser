replicaCount: 1

image:
  repository: lightpanda/browser
  pullPolicy: IfNotPresent
  tag: "0.4.1"
  # If set, takes precedence over `tag` (e.g. sha256:abcdef...)
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

server:
  host: "0.0.0.0"
  port: 9222
  protocols:
    - cdp
  advertiseHost: ""
  maxConnections: 16
  maxPendingConnections: 128
  maxMessageSize: 1048576
  maxHttpMessageSize: 4096
  httpSessionTimeout: 60

config:
  logLevel: "info"
  logFormat: "logfmt"
  obeyRobots: false
  blockPrivateNetworks: false
  cors: false
  loadResources: []
  watchdogMs: 30000
  httpTimeout: 15000
  httpConnectTimeout: 8000
  httpMaxConcurrent: 40
  timezone: "UTC"
  locale: "en-US"
  userAgent: ""
  userAgentSuffix: ""
  v8MaxHeapMb: 0
  blockUrls: []
  blockCidrs: []
  adblockLists: []
  proxy:
    enabled: false
    httpProxy: ""
    proxyBearerToken: ""
    existingSecret: ""
    existingSecretKey: ""

env:
  disableTelemetry: true
  disableCoreDump: true

extraArgs: []
extraEnv: []
extraEnvFrom: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# emptyDir mounted at /tmp to support readOnlyRootFilesystem
tmpVolume:
  enabled: true
  sizeLimit: ""

service:
  type: ClusterIP
  port: 9222
  nodePort: null
  annotations: {}

ingress:
  enabled: false
  className: ""
  # CDP/WebDriver are long-lived WebSocket connections. Ingress controllers
  # are annotation-driven and provider-specific, so no default annotations
  # are set here. See the "Ingress & WebSockets" section of the README for
  # examples (nginx, Traefik, HAProxy, Gateway API, ...).
  annotations: {}
  hosts:
    - host: lightpanda.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /json/version
    port: cdp
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /json/version
    port: cdp
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

startupProbe:
  httpGet:
    path: /json/version
    port: cdp
  initialDelaySeconds: 1
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 30

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  # Prometheus Operator PrometheusRule with alerting rules based on
  # Lightpanda's own metrics (see
  # https://github.com/lightpanda-io/browser/blob/main/src/Metrics.zig).
  # Requires metrics.enabled and a running Prometheus that watches
  # PrometheusRule resources (e.g. via kube-prometheus-stack).
  prometheusRule:
    enabled: false
    namespace: ""
    # Extra labels on the PrometheusRule object itself, e.g. to match your
    # Prometheus' ruleSelector.
    additionalLabels: {}
    # Each entry becomes one alerting rule; the template just `range`s over
    # this list, so you can tweak thresholds, disable, remove, reorder, or
    # add rules purely by editing values — no template changes needed.
    #
    # `expr` is rendered through Helm's `tpl`, so it may reference chart
    # values/helpers, e.g. `{{ include "lightpanda.fullname" . }}` to scope
    # the `job` label to this release. `labels`/`annotations` are NOT
    # processed by Helm and are emitted as-is, so Prometheus' own alert
    # templating (`{{ $value }}`, `{{ $labels.xxx }}`) works there with no
    # escaping needed. Set `enabled: false` to skip an entry without
    # deleting it.
    rules:
      - alert: LightpandaTargetDown
        enabled: true
        expr: 'up{job="{{ include "lightpanda.fullname" . }}"} == 0'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Lightpanda target down
          description: 'Prometheus has not been able to scrape this instance for over 5m (instance {{ $labels.instance }}).'
      - alert: LightpandaJSHeapLimitHit
        enabled: true
        expr: 'increase(js_heap_limits_total{job="{{ include "lightpanda.fullname" . }}"}[15m]) > 0'
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Lightpanda pages hitting the V8 heap limit
          description: '{{ $value }} page(s) were terminated in the last 15m for exceeding the V8 heap limit. Consider raising config.v8MaxHeapMb or investigating memory-heavy pages.'
      - alert: LightpandaHighJSErrorRate
        enabled: true
        expr: 'rate(js_errors_total{job="{{ include "lightpanda.fullname" . }}"}[10m]) > 0.1'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High rate of uncaught JS errors
          description: '{{ $value | printf "%.2f" }} uncaught JS errors/sec ({{ $labels.kind }}) over the last 10m (threshold 0.1/sec).'
      - alert: LightpandaHighHTTPErrorRate
        enabled: true
        expr: |-
          (
            sum(rate(http_error_total{job="{{ include "lightpanda.fullname" . }}"}[10m]))
            /
            sum(rate(http_requests_total{job="{{ include "lightpanda.fullname" . }}"}[10m]))
          ) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High outbound HTTP error rate
          description: 'More than 10% of outbound HTTP requests failed before a response, over the last 10m.'
      - alert: LightpandaConnectionLimitReached
        enabled: true
        expr: 'increase(serve_connection_limit_total{job="{{ include "lightpanda.fullname" . }}"}[5m]) > 0'
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Lightpanda CDP connection budget exhausted
          description: 'New connections were deferred because server.maxConnections was reached at least once in the last 5m. Consider raising server.maxConnections or scaling out.'
      - alert: LightpandaSessionTimeoutSpike
        enabled: true
        expr: 'increase(serve_session_timeouts_total{job="{{ include "lightpanda.fullname" . }}"}[15m]) > 0'
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: WebDriver/CDP sessions timing out
          description: '{{ $value }} session(s) timed out in the last 15m. Clients may not be closing sessions properly, or server.httpSessionTimeout may be too aggressive.'
      - alert: LightpandaInboxBacklogDrops
        enabled: true
        expr: 'increase(serve_inbox_backlog_total{job="{{ include "lightpanda.fullname" . }}"}[5m]) > 0'
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Lightpanda dropping connections due to message backlog
          description: '{{ $value }} websocket connection(s) were closed in the last 5m for queueing more unprocessed messages than the worker could drain — the driver may be overloaded.'
    # Extra rule groups appended as-is, using the standard Prometheus
    # Operator PrometheusRule `groups` schema, for fully custom alerts.
    additionalGroups: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  ingress: []
  # If left empty, egress defaults to allow-all (`to: []`), since the browser
  # needs unrestricted outbound access to navigate the web. Override this
  # list to restrict egress if needed.
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraVolumes: []
extraVolumeMounts: []
