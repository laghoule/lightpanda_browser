{{- if .Values.server.unixSocket }}
{{- if or .Values.ingress.enabled .Values.httpRoute.enabled (and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled) }}
{{- fail "server.unixSocket disables the TCP listener and the Service: ingress, httpRoute and metrics.serviceMonitor cannot be enabled with it" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lightpanda.fullname" . }}
  labels:
    {{- include "lightpanda.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lightpanda.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lightpanda.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lightpanda.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - lightpanda
            - serve
          # NOTE: the lightpanda CLI parser requires `--flag value` as two
          # separate tokens; it does NOT accept `--flag=value` (no `=`
          # splitting in its arg parser). Every value-taking flag below must
          # therefore be emitted as two list entries.
          args:
            {{- if .Values.server.unixSocket }}
            {{- /* --unix-socket is mutually exclusive with --host/--port/--advertise-host */}}
            - --unix-socket
            - {{ .Values.server.unixSocket | quote }}
            {{- else }}
            - --host
            - {{ .Values.server.host | quote }}
            - --port
            - {{ int .Values.server.port | quote }}
            {{- end }}
            - --log-level
            - {{ .Values.config.logLevel | quote }}
            - --log-format
            - {{ .Values.config.logFormat | quote }}
            {{- range .Values.server.protocols }}
            - --protocol
            - {{ . | quote }}
            {{- end }}
            {{- if and .Values.server.advertiseHost (not .Values.server.unixSocket) }}
            - --advertise-host
            - {{ .Values.server.advertiseHost | quote }}
            {{- end }}
            {{- if .Values.server.maxConnections }}
            - --cdp-max-connections
            - {{ int .Values.server.maxConnections | quote }}
            {{- end }}
            {{- if .Values.server.maxPendingConnections }}
            - --cdp-max-pending-connections
            - {{ int .Values.server.maxPendingConnections | quote }}
            {{- end }}
            {{- if .Values.server.maxMessageSize }}
            - --cdp-max-message-size
            - {{ int .Values.server.maxMessageSize | quote }}
            {{- end }}
            {{- if .Values.server.maxHttpMessageSize }}
            - --cdp-max-http-message-size
            - {{ int .Values.server.maxHttpMessageSize | quote }}
            {{- end }}
            {{- if .Values.server.httpSessionTimeout }}
            - --http-session-timeout
            - {{ int .Values.server.httpSessionTimeout | quote }}
            {{- end }}
            {{- range .Values.server.remoteAllowOrigins }}
            - --remote-allow-origins
            - {{ . | quote }}
            {{- end }}
            {{- if not .Values.metrics.enabled }}
            - --disable-metrics
            {{- end }}
            {{- if .Values.config.obeyRobots }}
            - --obey-robots
            {{- end }}
            {{- if .Values.config.blockPrivateNetworks }}
            - --block-private-networks
            {{- end }}
            {{- if not .Values.config.cors }}
            - --disable-features
            - cors
            {{- end }}
            {{- if .Values.config.corsStoreEntryLimit }}
            - --cors-store-entry-limit
            - {{ int .Values.config.corsStoreEntryLimit | quote }}
            {{- end }}
            {{- if .Values.config.cookieJar }}
            - --cookie-jar
            - {{ .Values.config.cookieJar | quote }}
            {{- end }}
            {{- range .Values.config.loadResources }}
            - --load-resources
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.config.watchdogMs }}
            - --watchdog-ms
            - {{ int .Values.config.watchdogMs | quote }}
            {{- end }}
            {{- if .Values.config.httpTimeout }}
            - --http-timeout
            - {{ int .Values.config.httpTimeout | quote }}
            {{- end }}
            {{- if .Values.config.httpConnectTimeout }}
            - --http-connect-timeout
            - {{ int .Values.config.httpConnectTimeout | quote }}
            {{- end }}
            {{- if .Values.config.httpMaxConcurrent }}
            - --http-max-concurrent
            - {{ int .Values.config.httpMaxConcurrent | quote }}
            {{- end }}
            {{- if .Values.config.httpCurves }}
            - --http-curves
            - {{ .Values.config.httpCurves | quote }}
            {{- end }}
            {{- if .Values.config.httpDebug }}
            - --http-debug
            {{- end }}
            {{- range .Values.config.renderFonts }}
            - --render-font
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.config.timezone }}
            - --timezone
            - {{ .Values.config.timezone | quote }}
            {{- end }}
            {{- if .Values.config.locale }}
            - --locale
            - {{ .Values.config.locale | quote }}
            {{- end }}
            {{- if .Values.config.userAgent }}
            - --user-agent
            - {{ .Values.config.userAgent | quote }}
            {{- end }}
            {{- if .Values.config.userAgentSuffix }}
            - --user-agent-suffix
            - {{ .Values.config.userAgentSuffix | quote }}
            {{- end }}
            {{- if gt (int .Values.config.v8MaxHeapMb) 0 }}
            - --v8-max-heap-mb
            - {{ int .Values.config.v8MaxHeapMb | quote }}
            {{- end }}
            {{- range .Values.config.blockUrls }}
            - --block-urls
            - {{ . | quote }}
            {{- end }}
            {{- range .Values.config.blockCidrs }}
            - --block-cidrs
            - {{ . | quote }}
            {{- end }}
            {{- range .Values.config.adblockLists }}
            - --adblock-lists
            - {{ . | quote }}
            {{- end }}
            {{- if and .Values.config.proxy.enabled .Values.config.proxy.httpProxy }}
            - --http-proxy
            - {{ .Values.config.proxy.httpProxy | quote }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if not .Values.server.unixSocket }}
          ports:
            - name: cdp
              containerPort: {{ int .Values.server.port }}
              protocol: TCP
          {{- end }}
          env:
            {{- if .Values.env.disableTelemetry }}
            - name: LIGHTPANDA_DISABLE_TELEMETRY
              value: "true"
            {{- end }}
            {{- if .Values.env.disableCoreDump }}
            - name: LIGHTPANDA_DISABLE_CORE_DUMP
              value: "true"
            {{- end }}
            {{- if and .Values.config.proxy.enabled .Values.config.proxy.proxyBearerToken }}
            - name: PROXY_BEARER_TOKEN
              value: {{ .Values.config.proxy.proxyBearerToken | quote }}
            {{- else if and .Values.config.proxy.enabled .Values.config.proxy.existingSecret }}
            - name: PROXY_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.proxy.existingSecret }}
                  key: {{ .Values.config.proxy.existingSecretKey | default "token" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and (has "cdp" .Values.server.protocols) (not .Values.server.unixSocket) }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.tmpVolume.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.tmpVolume.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.tmpVolume.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.tmpVolume.enabled }}
        - name: tmp
          emptyDir:
            {{- if .Values.tmpVolume.sizeLimit }}
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
            {{- else }}
            {}
            {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
