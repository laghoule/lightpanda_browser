{{- if and .Values.metrics.enabled .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lightpanda.fullname" . }}-dashboard
  {{- if .Values.metrics.grafanaDashboard.namespace }}
  namespace: {{ .Values.metrics.grafanaDashboard.namespace }}
  {{- end }}
  labels:
    {{- include "lightpanda.labels" . | nindent 4 }}
    {{- with .Values.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  lightpanda.json: |-
    {{- .Files.Get "dashboards/lightpanda.json" | nindent 4 }}
{{- end }}
