{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lightpanda.fullname" . }}
  labels:
    {{- include "lightpanda.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.httpRoute.parentRefs }}
  {{- fail "httpRoute.parentRefs must contain at least one Gateway when httpRoute.enabled is true" }}
  {{- end }}
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.httpRoute.pathType }}
            value: {{ .Values.httpRoute.path | quote }}
      backendRefs:
        - name: {{ include "lightpanda.fullname" . }}
          port: {{ int .Values.service.port }}
{{- end }}
